name: ci

on:
  workflow_call:
    inputs:
      ref:
        description: commit to test
        type: string
        required: true
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-cov pyyaml
      - name: Library tests
        run: python -m pytest -p no:cacheprovider -q tests
      - name: Workflow tests
        run: PYTHONPATH=workflow python -m pytest workflow/tests -p no:cacheprovider -q -o addopts=
